<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="NEXORION - Full-Stack Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060003"/><stop offset="0.6" stop-color="#1d0409"/><stop offset="1" stop-color="#4a0a16"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8102e"/><stop offset="1" stop-color="#6b0a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.35"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#glow)"/>

  <!-- horns -->
  <path d="M318 135 C285 105 272 62 300 24 C308 62 330 92 372 112 Z" fill="#be123c"/>
  <path d="M682 135 C715 105 728 62 700 24 C692 62 670 92 628 112 Z" fill="#be123c"/>

  <!-- title -->
  <text x="500" y="182" text-anchor="middle" font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" font-size="88" letter-spacing="10" fill="#e11d48" filter="url(#blur)">
    NEXORION
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="182" text-anchor="middle" font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" font-size="88" letter-spacing="10" fill="#f43f5e">NEXORION</text>
  <text x="500" y="226" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" letter-spacing="8" fill="#fda4af">FULL-STACK SOFTWARE ENGINEER</text>
  <text x="500" y="262" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" letter-spacing="6" fill="#be123c">ENGINEERING BEYOND BOUNDARIES</text>

  <!-- blood band -->
  <path d="M0 0 H1000 V24 Q950 36 900 24 T800 24 T700 24 T600 24 T500 24 T400 24 T300 24 T200 24 T100 24 T0 24 Z" fill="url(#blood)"/>

  <!-- drips -->
  <g fill="url(#blood)">
    <rect x="80"  y="18" width="12" height="60"  rx="6"><animate attributeName="height" values="60;85;60"   dur="5s"   repeatCount="indefinite"/></rect>
    <rect x="190" y="18" width="14" height="110" rx="7"><animate attributeName="height" values="110;135;110" dur="6s"   repeatCount="indefinite"/></rect>
    <rect x="310" y="18" width="10" height="45"  rx="5"><animate attributeName="height" values="45;70;45"   dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="440" y="18" width="12" height="85"  rx="6"><animate attributeName="height" values="85;105;85"  dur="5.5s" repeatCount="indefinite"/></rect>
    <rect x="560" y="18" width="14" height="125" rx="7"><animate attributeName="height" values="125;150;125" dur="6.5s" repeatCount="indefinite"/></rect>
    <rect x="690" y="18" width="10" height="55"  rx="5"><animate attributeName="height" values="55;80;55"   dur="4s"   repeatCount="indefinite"/></rect>
    <rect x="790" y="18" width="13" height="100" rx="6"><animate attributeName="height" values="100;125;100" dur="5.8s" repeatCount="indefinite"/></rect>
    <rect x="905" y="18" width="11" height="70"  rx="5"><animate attributeName="height" values="70;95;70"   dur="4.8s" repeatCount="indefinite"/></rect>
    <rect x="962" y="18" width="9"  height="40"  rx="4"><animate attributeName="height" values="40;62;40"   dur="4.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- falling drops -->
  <g fill="#c8102e">
    <circle cx="197" cy="140" r="5"><animate attributeName="cy" values="140;290" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="567" cy="155" r="5"><animate attributeName="cy" values="155;290" dur="3.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="3.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="796" cy="130" r="4"><animate attributeName="cy" values="130;290" dur="3.2s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="3.2s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
